
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    environment:
      SERVER_NAME: ':80'
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-roquette}?serverVersion=16&charset=utf8}
      MERCURE_URL: ${MERCURE_URL:-http://127.0.0.1/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-https://localhost/.well-known/mercure}
      MERCURE_COOKIE_NAME: ${MERCURE_COOKIE_NAME:-__Secure-mercure_access_token}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      database:
        condition: service_healthy
      garage:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  database:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB:  ${POSTGRES_DB:-roquette}
      POSTGRES_USER:  ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD:-!ChangeMe!}
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-roquette}"]
      interval: 5s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    platform: linux/amd64
    volumes:
      - clamav_data:/var/lib/clamav

  garage:
    build:
      context: docker/garage
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3900:3900"
    environment:
      AWS_KEY: ${AWS_KEY:-minioadmin}
      AWS_SECRET: ${AWS_SECRET:-minioadminpassword}
      AWS_BUCKET: ${AWS_BUCKET:-roquette-uploads}
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/garage", "health"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-pull-model:
    image: curlimages/curl:latest
    entrypoint: [ "sh", "-c", "until curl -s http://ollama:11434/api/tags > /dev/null; do sleep 1; done; curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen2.5:3b\"}' && curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"nomic-embed-text\"}'" ]
    depends_on:
      - ollama

volumes:
  caddy_data:
  caddy_config:
  db_data:
  clamav_data:
  garage_meta:
  garage_data:
  ollama_data:
  redis_data:
