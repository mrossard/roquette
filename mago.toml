#:schema https://mago.carthage.software/1.29.0/schema.json
# Welcome to Mago!
# For full documentation, see https://mago.carthage.software/tools/overview
version = "1"
php-version = "8.4.0"

[source]
workspace = "."
paths = ["mate/src/", "src/", "tests/"]
excludes = ["vendor"]

[source.glob]
literal-separator = true

[formatter]
print-width = 120
tab-width = 4
use-tabs = false

[linter]
integrations = ["symfony", "phpunit"]

[linter.rules]
literal-named-argument = { enabled = false }
no-literal-password = { enabled = false }
kan-defect = { enabled = false }
no-boolean-flag-parameter = { enabled = false }

# Thresholds tightened to the actual codebase limits
cyclomatic-complexity = { threshold = 50, method-threshold = 22 }
too-many-methods = { threshold = 40, count-setters-and-getters = false }
excessive-parameter-list = { threshold = 10, constructor-threshold = 20 }
too-many-properties = { threshold = 30 }
halstead = { effort-threshold = 7000 }

# Additional active code quality & safety rules
no-dead-store = { enabled = true }
no-unused-closure-capture = { enabled = true }
no-unused-global = { enabled = true }
no-unused-static = { enabled = true }
no-redundant-else = { enabled = true }
switch-continue-to-break = { enabled = true }
no-alternative-syntax = { enabled = true }
prefer-self-return-type = { enabled = true }
prefer-datetimeimmutable-create-from-timestamp = { enabled = true }
prefer-explode-over-preg-split = { enabled = true }
no-short-bool-cast = { enabled = true }
no-is-null = { enabled = true }
no-null-property-init = { enabled = true }
no-assign-in-argument = { enabled = true }
no-parameter-shadowing = { enabled = true }
no-array-accumulation-in-loop = { enabled = true }
no-side-effects-with-declarations = { enabled = true }
no-iterator-to-array-in-foreach = { enabled = true }
disallowed-type-instantiation = { enabled = true }
sorted-integer-keys = { enabled = true }

[analyzer]
plugins = []
find-unused-definitions = true
memoize-properties = true
allow-possibly-undefined-array-keys = true
check-throws = false
unchecked-exceptions = ["Error", "LogicException"]
unchecked-exception-classes = []
strict-list-index-checks = false
strict-array-index-existence = false
allow-array-truthy-operand = false
no-boolean-literal-comparison = false
register-super-globals = true
