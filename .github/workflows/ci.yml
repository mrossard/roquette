name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: roquette_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: '!ChangeMePostgresPassword!'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, pdo_pgsql, pdo_sqlite
        coverage: none

    - name: Get Composer Cache Directory
      id: composer-cache
      run: |
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install Composer dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Setup Database
      env:
        DATABASE_URL: postgresql://app:!ChangeMePostgresPassword!@127.0.0.1:5432/roquette?serverVersion=16&charset=utf8
      run: |
        bin/console doctrine:database:create --env=test --if-not-exists
        bin/console doctrine:migrations:migrate --env=test --no-interaction

    - name: Run Linter (Mago)
      run: vendor/bin/mago lint src tests

    - name: Run Tests
      env:
        DATABASE_URL: postgresql://app:!ChangeMePostgresPassword!@127.0.0.1:5432/roquette?serverVersion=16&charset=utf8
      run: vendor/bin/phpunit

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Docker environment
        env:
          MERCURE_PUBLIC_URL: http://localhost:8000/.well-known/mercure
        run: |
          docker compose -f compose.yaml up -d --build

      - name: Wait for application readiness
        run: |
          echo "Waiting for Roquette web server..."
          for i in $(seq 1 60); do
            if curl -s -f http://127.0.0.1:8000/login > /dev/null 2>&1 || curl -s -f http://localhost:8000/login > /dev/null 2>&1; then
              echo "Application is ready!"
              break
            fi
            echo "Waiting ($i/60)..."
            sleep 2
          done

      - name: Seed E2E test data
        run: |
          docker compose -f compose.yaml exec -T php bin/console app:seed-e2e-data

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          CI: true
          APP_BASE_URL: http://localhost:8000

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

